/elevation_mapping_node:
  ros__parameters:
    map_frame: "map"
    base_frame: "base_link"
    corrected_map_frame: "map"

    resolution: 0.10
    map_length: 20.0
    max_ray_length: 12.0
    max_height_range: 4.0
    min_valid_distance: 0.2

    enable_drift_compensation: false
    enable_drift_corrected_TF_publishing: false
    enable_pointcloud_publishing: false
    enable_normal_arrow_publishing: false

    subscribers:
      unilidar:
        topic_name: "/unilidar/cloud"
        data_type: "pointcloud"

    publishers:
      elevation_map_raw:
        layers: ["elevation", "traversability", "variance"]
        basic_layers: ["elevation"]
        fps: 3.0
      elevation_map_filter:
        layers: ["min_filter", "smooth", "inpaint", "elevation", "traversability", "variance"]
        basic_layers: ["min_filter"]
        fps: 2.0
